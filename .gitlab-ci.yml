mintsclub-design-v2:
  stage: deploy
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - echo "Deploy to QA server"
    - ssh-add <(echo "$QA_SSH_KEY_V2")
    - rm -rf .git
    - ssh -o StrictHostKeyChecking=no $QA_SERVER_USER_V2@$SERVER_IP "cd /home/mints-club/frontend-v2/frontend; git reset --hard; git pull origin mintsclub-design-v2; yarn install; npm run build; exit"
  only:
    - mintsclub-design-v2