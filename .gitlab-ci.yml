mintsclub-v2:
  stage:  deploy
  image: usamaciit96/node-yarn-npm-iz:v2
  before_script:
    - cd /root/frontend-v2/frontend
    - git reset --hard
    - git pull origin mintsclub-design-v2
    - yarn install
    - npm run build
    - cd /root/frontend-v2
    - tar -xzvf frontend.tar.gz frontend
    - scp -rp frontend.tar.gz mintsclub@3.135.80.29:/home/mintsclub/mintsclub-prod/.
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'

  script:
    - echo "Deploying MintsClub-Frontend-V2 to AWS Server"
    - ssh-add <(echo "$AWS_KEY")
    - rm -rf .git
    - ssh -o StrictHostKeyChecking=no $AWS_USER@$AWS_SERVER_IP "cd /home/mintsclub/mintsclub-prod;  tar -xzvf frontend.tar.gz; exit"

  only:
    - mintsclub-design-v2