mintsclub-v3:
  stage: deploy
  before_script:
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - echo "Deploy to mintsclub-v3 server"
    - ssh-add <(echo "$SSH_KEY_V3")
    - rm -rf .git
    - ssh -o StrictHostKeyChecking=no mintsclub@10.10.10.41 "cd /home/mintsclub/mintsclub-frontend/frontend-v2/frontend git reset --hard;  git pull origin mintsclub-v3; yarn install; npm run build; exit"
  only:
    - mintsclub-v3
