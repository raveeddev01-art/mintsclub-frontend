mintsclub-Front-v2:
  stage:  deploy
  tags:
    - mintsclub-io
  image: usamaciit96/mintsclub-v2:v2
  script:
    - cd /root/frontend-v2/frontend
    - git reset --hard
    - git pull origin mintsclub-design-v2
    - which node
    - node -v
    - npm cache clean --force
    - yarn install
    - unset CI
    - npm run build
    - cd /root/frontend-v2
    - tar -czf frontend.tar.gz frontend
    - scp -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -rp  frontend.tar.gz mintsclub@3.135.80.29:/home/mintsclub/mintsclub-prod/.

  after_script:
    - echo "Deploying MintsClub-Frontend-V2 to AWS Server"
    - ssh -o StrictHostKeyChecking=no $AWS_USER@$AWS_SERVER_IP "cd /home/mintsclub/mintsclub-prod; rm -rf frontend; tar -xzf frontend.tar.gz; rm -rf frontend.tar.gz; exit"

  only:
    - mintsclub-design-v2