mintsclub-v2:
  stage: deploy
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - echo "Deploy to QA server"
    - ssh-add <(echo "$SSH_KEY_V2")
    - rm -rf .git
    - ssh -o StrictHostKeyChecking=no $SERVER_USER_V2@$SERVER_IP "cd /home/mintsclub-v2/mintsclub-v2/frontend; git reset --hard; git pull origin task/mintsClubUi-ariswap-v2; cd /home/mintsclub-v2/mintsclub-v2/frontend/frontend; yarn install; npm run build; exit"
  only:
    - task/mintsClubUi-ariswap-v2
    
sonarqube-Analyze:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  only:
    - task/mintsClubUi-ariswap-v2
