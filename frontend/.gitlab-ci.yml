mints-frontend:
  stage: deploy
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - echo "Deploy to dev server"
    - ssh-add <(echo "$ID_RSA")
    - rm -rf .git
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP " cd /home/ariswap/ariswap/frontend; git reset --hard; git pull origin task/Integrate-MintsClubUI; sudo rm -rf /var/www/ariswap-frontend; sudo cp -r frontend /var/www/ariswap-frontend; sudo chown -R www-data:www-data /var/www/; exit"
  only:
    - task/Integrate-MintsClubUI